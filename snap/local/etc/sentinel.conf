# Seeded to /var/snap/_NAME_/current/etc/valkey/sentinel.conf on install.
# Sentinel REWRITES this file at runtime (state, myid).
# Configure a master to monitor, then: sudo snap start _NAME_.valkey-sentinel

port 26379
bind 127.0.0.1
dir /var/snap/_NAME_/common/data
logfile /var/snap/_NAME_/common/log/valkey-sentinel.log
pidfile /var/snap/_NAME_/current/run/valkey-sentinel.pid

# Example: monitor this snap's own server (quorum 1):
# sentinel monitor mymaster 127.0.0.1 6379 1
