# Seeded to /var/snap/_NAME_/current/etc/valkey/valkey.conf on install.
# Edit there and: sudo snap restart _NAME_.valkey-server
# The server may rewrite this file (CONFIG REWRITE).

bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
supervised no
dir /var/snap/_NAME_/common/data
logfile /var/snap/_NAME_/common/log/valkey-server.log
pidfile /var/snap/_NAME_/current/run/valkey-server.pid
unixsocket /var/snap/_NAME_/current/run/valkey.sock
unixsocketperm 770

# Percona modules (the full valkey bundle) — all preloaded.
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libjson.so
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libvalkey_bloom.so
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libsearch.so
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libvalkeyaudit.so

# Audit module (see usr/share/percona-valkey-audit/valkey-audit.conf.default
# in the snap for the full option reference).
audit.enabled yes
audit.protocol file
audit.format text
audit.events all
