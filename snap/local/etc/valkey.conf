# Seeded to /var/snap/_NAME_/current/etc/valkey/valkey.conf on install.
# Edit there and: sudo snap restart _NAME_.valkey-server
# The server may rewrite this file (CONFIG REWRITE).

bind 127.0.0.1
port 6379
protected-mode yes
daemonize no
supervised no
dir /var/snap/_NAME_/common/data
logfile /var/snap/_NAME_/common/log/valkey-server.log
pidfile /var/snap/_NAME_/current/run/valkey-server.pid
unixsocket /var/snap/_NAME_/current/run/valkey.sock
unixsocketperm 770

# Percona modules (the full valkey bundle) — all preloaded.
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libjson.so
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libvalkey_bloom.so
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libsearch.so
loadmodule /snap/_NAME_/current/usr/lib/valkey/modules/libvalkeyaudit.so

# (full option reference: usr/share/*/valkey-audit.conf.default inside the snap)
# NOTE: audit.protocol's "file" mode REQUIRES an explicit path as a second
# argument on the same line ("file <path>") — the module's own .default
# reference doesn't document this, but without a path it fails to open its
# built-in default (/var/log/valkey/audit.log, not writable in the snap) and
# aborts the whole server at startup (module init failure = hard abort, not
# a graceful disable). Verified empirically during Task 5 smoke testing.
# NOTE: valkey-server logs a harmless "Failed to open audit log file
# /var/log/valkey/audit.log" line at startup before this file-path
# directive applies.
audit.enabled yes
audit.protocol file /var/snap/_NAME_/common/log/audit.log
audit.format text
audit.events all
