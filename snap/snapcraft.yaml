name: percona-valkey
version: '9.1.1-1'
summary: Percona for Valkey with all bundle modules in a snap.
description: |
  Percona for Valkey packages Valkey — the open-source, Linux
  Foundation-backed key/value datastore — together with Percona's full
  module bundle, all preloaded and ready to use: valkey-json (JSON.*),
  valkey-bloom (BF.*), valkey-search (FT.* vector/full-text search), and
  valkey-audit (audit logging of connections, auth, and commands).

  On install the snap starts valkey-server on 127.0.0.1:6379; try it:
    percona-valkey.valkey-cli ping
    percona-valkey.valkey-cli JSON.SET doc $ '{"hello":"world"}'
    percona-valkey.valkey-cli BF.ADD filter item

  There is NO password by default — protected-mode restricts access to
  localhost, but any local process has full access until you set
  `requirepass` or ACLs in the config. Config lives at
  /var/snap/percona-valkey/current/etc/valkey/valkey.conf (the server may
  rewrite it); extra flags via
  `sudo snap set percona-valkey valkey-args="..."`. Audit events are
  logged via the valkey-audit module (see the option reference at
  /snap/percona-valkey/current/usr/share/percona-valkey-audit/).

  Valkey Sentinel ships disabled: configure a `sentinel monitor` line in
  /var/snap/percona-valkey/current/etc/valkey/sentinel.conf, then
  `sudo snap start percona-valkey.valkey-sentinel`.

  Redis-compatible aliases (redis-cli, redis-benchmark, redis-check-aof,
  redis-check-rdb) are included for drop-in familiarity. Input/output
  files for the CLI tools must live under /var/snap/percona-valkey/common
  (the snap cannot read your home directory).

base: core26
confinement: strict
grade: stable

license: Apache-2.0

platforms:
  amd64:
  arm64:

system-usernames:
  snap_daemon: shared

contact: https://github.com/EvgeniyPatlan/percona-valkey-snap
issues: https://github.com/EvgeniyPatlan/percona-valkey-snap/issues
source-code: https://github.com/EvgeniyPatlan/percona-valkey-snap
website: https://www.percona.com/valkey

hooks:
  install:
    plugs:
      - network
      - network-bind
  configure: {}

package-repositories:
  - type: apt
    url: https://repo.percona.com/valkey-91/apt
    suites: [resolute]
    components: [main]
    key-id: 4D1BB29D63D98E422B2113B19334A25F8507EFA5
    # NOTE: percona-valkey-bundle is deliberately NOT staged — as of 9.1.1-2 its
    # Depends names percona-valkey-ldap, which valkey-91 does not ship, making
    # the meta uninstallable. Components are pinned individually instead.

apps:
  valkey-server:
    command: bin/valkey-server.sh
    daemon: simple
    stop-timeout: 5m
    plugs:
      - network
      - network-bind

  valkey-sentinel:
    command: bin/valkey-sentinel.sh
    daemon: simple
    install-mode: disable
    plugs:
      - network
      - network-bind

  valkey-cli:
    command: usr/bin/valkey-cli
    plugs:
      - network

  valkey-benchmark:
    command: usr/bin/valkey-benchmark
    plugs:
      - network

  valkey-check-aof:
    command: usr/bin/valkey-check-aof
    plugs:
      - network

  valkey-check-rdb:
    command: usr/bin/valkey-check-rdb
    plugs:
      - network

  redis-cli:
    command: usr/bin/redis-cli
    plugs:
      - network

  redis-benchmark:
    command: usr/bin/redis-benchmark
    plugs:
      - network

  redis-check-aof:
    command: usr/bin/redis-check-aof
    plugs:
      - network

  redis-check-rdb:
    command: usr/bin/redis-check-rdb
    plugs:
      - network

parts:
  packages-deb:
    plugin: nil
    stage-packages:
      - percona-valkey-server=1:9.1.1-1.resolute
      - percona-valkey-tools=1:9.1.1-1.resolute
      - percona-valkey-sentinel=1:9.1.1-1.resolute
      - percona-valkey-compat-redis=1:9.1.1-1.resolute
      - percona-valkey-json=1.0.2-1.resolute
      - percona-valkey-bloom=1.0.1-1.resolute
      - percona-valkey-search=1.2.0-1.resolute
      - percona-valkey-audit=1.0.0-1.resolute
      - util-linux

    organize:
      # Copyright files — verify all 8 debs ship these.
      usr/share/doc/percona-valkey-server/copyright: licenses/COPYRIGHT-percona-valkey-server
      usr/share/doc/percona-valkey-tools/copyright: licenses/COPYRIGHT-percona-valkey-tools
      usr/share/doc/percona-valkey-sentinel/copyright: licenses/COPYRIGHT-percona-valkey-sentinel
      usr/share/doc/percona-valkey-compat-redis/copyright: licenses/COPYRIGHT-percona-valkey-compat-redis
      usr/share/doc/percona-valkey-json/copyright: licenses/COPYRIGHT-percona-valkey-json
      usr/share/doc/percona-valkey-bloom/copyright: licenses/COPYRIGHT-percona-valkey-bloom
      usr/share/doc/percona-valkey-search/copyright: licenses/COPYRIGHT-percona-valkey-search
      usr/share/doc/percona-valkey-audit/copyright: licenses/COPYRIGHT-percona-valkey-audit

      # Deb-shipped configs relocated aside: our snap-scripts templates own
      # the live paths; these stay as operator reference copies.
      etc/valkey/valkey.conf: usr/share/percona-valkey-server/valkey.conf.default
      etc/valkey/sentinel.conf: usr/share/percona-valkey-sentinel/sentinel.conf.default
      etc/valkey/valkey.conf.d/valkey-audit.conf: usr/share/percona-valkey-audit/valkey-audit.conf.default

    prime:
      - -etc/init.d
      - -etc/default
      - -etc/logrotate.d
      - -lib/systemd
      - -usr/lib/systemd
      - -usr/share/man
      # Mute lint by removing unnecessary libs flagged as unused by the
      # snapcraft library linter (glibc compat stubs and NSS modules not
      # dlopen'd or linked at runtime by anything staged in this snap) —
      # verified via grep across usr/bin, usr/sbin, and usr/lib/valkey.
      - -usr/lib/*/libBrokenLocale.so*
      - -usr/lib/*/libanl.so*
      - -usr/lib/*/libc_malloc_debug.so*
      - -usr/lib/*/libdl.so*
      - -usr/lib/*/libdrop_ambient.so*
      - -usr/lib/*/libmemusage.so*
      - -usr/lib/*/libmvec.so*
      - -usr/lib/*/libnsl.so*
      - -usr/lib/*/libnss_compat.so*
      - -usr/lib/*/libnss_dns.so*
      - -usr/lib/*/libnss_files.so*
      - -usr/lib/*/libnss_hesiod.so*
      - -usr/lib/*/libpamc.so*
      - -usr/lib/*/libpcprofile.so*
      - -usr/lib/*/libpthread.so*
      - -usr/lib/*/libresolv.so*
      - -usr/lib/*/librt.so*
      - -usr/lib/*/libthread_db.so*
      - -usr/lib/*/libtic.so*
      - -usr/lib/*/libutil.so*

  snap-scripts:
    plugin: dump
    source: snap/local
    override-prime: |
      craftctl default
      # Scoped to this part's own files by name — a bare etc/*.conf glob
      # would also sweep unrelated system configs (adduser.conf,
      # debconf.conf, etc.) staged into the same shared prime dir by other
      # parts, risking a false-positive _NAME_ substring match there.
      for f in bin/valkey-server.sh bin/valkey-sentinel.sh etc/valkey.conf etc/sentinel.conf; do
        sed -i "s/_NAME_/$SNAPCRAFT_PROJECT_NAME/g" "$f"
      done

  snap-license:
    plugin: dump
    source: .
    stage:
      - licenses/LICENSE-snap
    organize:
      LICENSE: licenses/LICENSE-snap
