project: percona-valkey-snap

path: /home/ubuntu/percona-valkey-snap

environment:
  CRAFT_ARTIFACT: $(HOST:printenv CRAFT_ARTIFACT)

backends:
  lxd:
    type: lxd
    systems:
      - ubuntu-24.04

suites:
  spread/tests/:
    summary: General integration tests
    prepare: |
      apt remove --purge --yes percona-valkey* valkey* || true

exclude:
  - .git

kill-timeout: 1h
