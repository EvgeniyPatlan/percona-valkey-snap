summary: Percona for Valkey smoke tests

prepare: |
  snap install "${SPREAD_PATH}/$(basename "${CRAFT_ARTIFACT}")" --dangerous --jailmode
  ok=0
  for _ in $(seq 30); do
    percona-valkey.valkey-cli ping 2>/dev/null | grep -q PONG && { ok=1; break; }
    sleep 2
  done
  [ "$ok" = 1 ]

execute: |
  echo "Percona for Valkey smoke tests"

  echo "Test server is running and responding"
  percona-valkey.valkey-cli ping | grep -q PONG

  echo "Test version (expected value derived from snapcraft.yaml, never hardcoded)"
  SNAP_VERSION=$(awk -F\' '/^version/{print $2}' "${SPREAD_PATH}"/snap/snapcraft.yaml)
  VALKEY_VERSION="${SNAP_VERSION%%-*}"
  percona-valkey.valkey-cli INFO server | grep -q "valkey_version:${VALKEY_VERSION:-error}"

  echo "Test basic SET/GET"
  percona-valkey.valkey-cli SET test-key "hello-world"
  percona-valkey.valkey-cli GET test-key | grep -q "hello-world"

  echo "Test MODULE LIST contains all five Percona modules"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "audit"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "bf"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "json"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "search"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "ldap"

  echo "Test JSON module"
  percona-valkey.valkey-cli JSON.SET doc \$ '{"hello":"world"}' | grep -q OK
  percona-valkey.valkey-cli JSON.GET doc | grep -q hello

  echo "Test Bloom filter module"
  percona-valkey.valkey-cli BF.ADD filter item1 | grep -q 1
  percona-valkey.valkey-cli BF.EXISTS filter item1 | grep -q 1

  echo "Test Search module"
  percona-valkey.valkey-cli FT.CREATE idx1 ON HASH PREFIX 1 doc: SCHEMA title TEXT | grep -q OK
  percona-valkey.valkey-cli FT.INFO idx1 | grep -q idx1

  echo "Test audit log destination"
  percona-valkey.valkey-cli SET audit-test-key "test-value"
  ok=0
  for _ in $(seq 15); do
    grep -q "\[CONNECTION\]" /var/snap/percona-valkey/common/log/audit.log 2>/dev/null && { ok=1; break; }
    sleep 1
  done
  [ "$ok" = 1 ]

  echo "Test snap services are correctly configured"
  snap services | grep -qE '\.valkey-server\s+enabled\s+active'
  snap services | grep -qE '\.valkey-sentinel\s+disabled\s+inactive'

  echo "Test CONFIG REWRITE and restart"
  percona-valkey.valkey-cli CONFIG REWRITE | grep -q OK
  snap restart percona-valkey.valkey-server
  sleep 5
  ok=0
  for _ in $(seq 30); do
    percona-valkey.valkey-cli ping 2>/dev/null | grep -q PONG && { ok=1; break; }
    sleep 2
  done
  [ "$ok" = 1 ]
  percona-valkey.valkey-cli MODULE LIST | grep -qx "audit"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "bf"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "json"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "search"
  percona-valkey.valkey-cli MODULE LIST | grep -qx "ldap"

restore: |
  snap remove percona-valkey --purge --terminate || true
